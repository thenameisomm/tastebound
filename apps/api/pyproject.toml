[project]
name = "tastebound-api"
version = "0.1.0"
description = "TasteBound API: taste-led origin market intelligence for destinations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.2",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "trafilatura>=2.0.0",
  "beautifulsoup4>=4.12.3",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "respx>=0.21.1",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-beautifulsoup4>=4.12.0.20241020",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tastebound_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: hits real external services; never run in CI",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["tests/", "scripts/"]
[[tool.mypy.overrides]]
module = ["trafilatura.*", "bs4.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tastebound_api"]
omit = ["tastebound_api/main.py", "tastebound_api/db/*"]
